<div class="auth-container">
  <mat-card class="auth-card">
    <div class="card-header">
      <img src="assets/login-icon.svg" alt="Login" class="login-icon" />
      <h2>Iniciar Sesión</h2>
      <p>Accede a tu cuenta para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
     <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre de usuario</mat-label>
      <mat-icon matPrefix></mat-icon>
      <input matInput type="text" formControlName="username" required />
    </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix></mat-icon>
        <input matInput type="password" formControlName="password" required />
      </mat-form-field>

      <div class="actions">
          <p class="switch-auth">
         ¿No tienes cuenta?
         <a routerLink="/register">Resitrarte</a>
       </p>
        <a class="forgot-password" href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <button mat-flat-button color="primary" class="full-width login-button" type="submit" [disabled]="form.invalid">
        Iniciar sesión
      </button>

    </form>
  </mat-card>
</div>
